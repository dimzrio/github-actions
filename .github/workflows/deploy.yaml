name: Deploy (Reusable Workflow)

on:
  workflow_call:
    inputs:
      env:
        type: string
    secrets:
      auth-token:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          echo "Deploy to env ${{ inputs.env }}"
          echo "Uses secrets ${{ secrets.auth-token }}"
