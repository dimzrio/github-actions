name: Deploy
on: push

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "deploy apps..."

  e2e-testing:
    needs: deploy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paths:
          - /users
          - /login
          - /apis
    steps:
      - run: echo "curl https://example.com${{ matrix.paths }}"
