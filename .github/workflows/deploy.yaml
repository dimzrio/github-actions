name: Deploy
on: push

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Failed scenario" && exit 1

  create-issue:
    runs-on: ubuntu-latest
    if: ${{ failure() }}
    needs: [ build-test ]
    steps:
      - run: echo "Create github issue"

  send-alert:
    runs-on: ubuntu-latest
    if: ${{ failure() }}
    needs: [ build-test ]
    steps:
      - run: echo "Failed alert test"

  quality-code:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [ build-test ]
    steps:
      - run: echo "Failed alert test"

  deploy:
    runs-on: ubuntu-latest
    needs: [ create-issue, send-alert, quality-code ]
    if: needs.create-issue.result == 'skipped'
    steps:
      - run: echo "Deploying to ..."
