name: Deploy

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: build
        run: echo "Linting and building project"

  tests:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Running unit tests
        run: echo "Running tests..."
      - name: Failed scenario
        run: exit 1

  deploy:
    runs-on: ubuntu-latest
    needs:
      - tests
    steps:
      - name: Deploying
        run: echo "Deploying to ..."

  create-issue-if-test-failed:
    runs-on: ubuntu-latest
    if: ${{ failure() }}
    needs:
      - build
      - tests
    steps:
      - name: Create github issue
        run: echo "Tests Failed in CI Pipeline"

  e2e-test:
    runs-on: ubuntu-latest
    needs:
      - deploy
    steps:
      - name: Testing end-to-end
        run: echo "Testing..."
