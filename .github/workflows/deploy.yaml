name: Deploy
on: push

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Build and test"

  create-issue-if-test-failed:
    runs-on: ubuntu-latest
    if: ${{ failure() }}
    needs: [ build-test ]
    steps:
      - run: echo "Create github issue"

  deploy:
    runs-on: ubuntu-latest
    needs: [ create-issue ]
    if: always() && needs.create-issue.result == 'skipped'
    steps:
      - run: echo "Deploying to ..."
