name: Deploy

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: build
        run: echo "Linting and building project"

  tests:
    runs-on: ubuntu-latest
    needs:
      - lint-build
    steps:
      - name: Running unit tests
        run: echo "Running tests..."
      - name: Failed scenario
        run: exit 1

  deploy:
    runs-on: ubuntu-latest
    needs:
      - unit-tests
    steps:
      - name: Deploying
        run: echo "Deploying to ..."

  create-issue-from-test:
    runs-on: ubuntu-latest
    if: ${{ failure() }}
    needs:
      - lint-build
      - unit-tests
    steps:
      - name: Create github issue
        run: echo "Tests Failed in CI Pipeline"
