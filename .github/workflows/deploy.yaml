name: Deploy
on: push

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Failed scenario" && exit 1

  create-issue-if-test-failed:
    runs-on: ubuntu-latest
    if: ${{ failure() }}
    needs: [ build-test ]
    steps:
      - run: echo "Create github issue"

  send-alert:
    runs-on: ubuntu-latest
    if: ${{ failure() }}
    needs: [ build-test ]
    steps:
      - run: echo "Failed alert test"

  deploy:
    runs-on: ubuntu-latest
    needs: [ create-issue-if-test-failed, send-alert ]
    if: needs.create-issue-if-test-failed.result == 'skipped'
    steps:
      - run: echo "Deploying to ..."
