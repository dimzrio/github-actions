name: Deploy

on: push

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - name: Lint and build
        run: echo "Linting and building project"

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Running unit tests
        run: echo "Running tests..."
      - name: Make Failing tests
        run: exit 1

  issue:
    runs-on: ubuntu-latest
    if: ${{ failure() }}
    needs:
      - unit-tests
    steps:
      - name: Create github issue
        run: echo "Tests Failed in CI Pipeline"

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploying
        run: echo "Deploying to ..."
