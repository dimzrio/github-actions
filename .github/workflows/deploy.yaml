name: Deploy
on: push

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Build and test"

  create-issue:
    runs-on: ubuntu-latest
    if: ${{ failure() }}
    needs: [ build-test ]
    steps:
      - run: echo "Create github issue"

  quality-code:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Failed alert test"

  create-report:
    runs-on: ubuntu-latest
    needs: [ quality-code ]
    steps:
      - run: echo "Failed alert test"

  deploy:
    runs-on: ubuntu-latest
    needs: [ create-issue, create-report ]
    if: needs.create-issue.result == 'skipped'
    steps:
      - run: echo "Deploying to ..."
